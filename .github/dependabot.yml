# Dependabot: weekly pull requests for outdated dependencies. Updates of the same kind are grouped
# into one pull request; CircleCI runs the tests on each.
version: 2
updates:
  # The app (Core, Desktop: Avalonia, SkiaSharp, SSH.NET), the developer checks (WorldCheck) and the
  # documentation's pictures (DocsScreenshots: SkiaSharp, kept with the app's).
  - package-ecosystem: nuget
    directories:
      # Directory.Build.props: the analyzers every project uses (Roslynator).
      - /
      - /editor/Core
      - /editor/Desktop
      - /tools/WorldCheck
      - /tools/DocsScreenshots
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app:
        patterns: ["*"]

  # The C# tests (xUnit, JUnit logger, coverage and hang dump; SkiaSharp for Core's, YamlDotNet for Expand World's).
  - package-ecosystem: nuget
    directories:
      - /editor/tests/Core.Tests
      - /editor/tests/Desktop.Tests
      - /editor/tests/AddOns.Tests
      - /addons/Tunnelheim/tests/Tunnelheim.WorldEditor.Tests
      - /addons/Riverheim/tests/Riverheim.WorldEditor.Tests
      - /addons/ExpandWorld/tests/ExpandWorld.WorldEditor.Tests
      - /addons/Railroads/tests/Railroads.WorldEditor.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      tests:
        patterns: ["*"]
    ignore:
      # The window tests run through Avalonia.Headless.XUnit, built against xUnit 3 (12.1.3 needs
      # xunit.v3.extensibility.core 3.2.2): xUnit 4 waits until an Avalonia release supports it.
      - dependency-name: xunit.v3.mtp-v2
        update-types: ["version-update:semver-major"]
      # FsCheck.Xunit.v3 3.4 needs xUnit 4 too.
      - dependency-name: FsCheck.Xunit.v3
        versions: [">=3.4.0"]

  # The GitHub Actions workflows (Scorecard, dependency review). Actions are pinned to commits;
  # Dependabot moves the pin and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # The fuzzing build image (.clusterfuzzlite/Dockerfile), pinned by digest.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
