# Dependabot: weekly pull requests for outdated dependencies. Updates of the same kind are grouped
# into one pull request; CircleCI runs the tests on each.
version: 2
updates:
  # The app (Core, Desktop: Avalonia, SkiaSharp, SSH.NET) and the developer checks (WorldCheck).
  - package-ecosystem: nuget
    directories:
      - /Core
      - /Desktop
      - /tools/WorldCheck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app:
        patterns: ["*"]

  # The C# tests (xUnit, test SDK, JUnit logger).
  - package-ecosystem: nuget
    directory: /tests/Desktop.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      tests:
        patterns: ["*"]
    ignore:
      # The window tests run through Avalonia.Headless.XUnit, built against xUnit 3 (12.1.3 needs
      # xunit.v3.extensibility.core 3.2.2): xUnit 4 waits until an Avalonia release supports it.
      - dependency-name: xunit.v3
        update-types: ["version-update:semver-major"]
      - dependency-name: xunit.runner.visualstudio
        update-types: ["version-update:semver-major"]

  # The game-look exporter's Python packages (also bundled in the release).
  - package-ecosystem: pip
    directory: /tools/asset-export
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      exporter:
        patterns: ["*"]
    ignore:
      # The exporter relies on UnityPy 1.25's API: newer minor versions need checking against
      # the game's files first (see docs/development.md). No patch updates either: from 1.25.3 it
      # needs tpk_ar, which has no wheel, so the Windows runtime (wheels only) takes 1.25.2 while
      # Linux takes the newest, and each one's trim list (tools/python-runtime) was traced with
      # those; raising the minimum (as a Dependabot PR did) breaks the Windows package.
      - dependency-name: UnityPy
