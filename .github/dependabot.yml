# Dependabot: weekly pull requests for outdated dependencies. Updates of the same kind are grouped
# into one pull request; CircleCI runs the tests on each.
version: 2
updates:
  # The app (Core, Desktop: Avalonia, SkiaSharp, SSH.NET), the developer checks (WorldCheck) and the
  # documentation's pictures (DocsScreenshots: SkiaSharp, kept with the app's).
  - package-ecosystem: nuget
    directories:
      - /Core
      - /Desktop
      - /tools/WorldCheck
      - /tools/DocsScreenshots
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app:
        patterns: ["*"]

  # The C# tests (xUnit, test SDK, JUnit logger).
  - package-ecosystem: nuget
    directory: /tests/Desktop.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      tests:
        patterns: ["*"]
    ignore:
      # The window tests run through Avalonia.Headless.XUnit, built against xUnit 3 (12.1.3 needs
      # xunit.v3.extensibility.core 3.2.2): xUnit 4 waits until an Avalonia release supports it.
      - dependency-name: xunit.v3
        update-types: ["version-update:semver-major"]
      - dependency-name: xunit.runner.visualstudio
        update-types: ["version-update:semver-major"]

  # The GitHub Actions workflows (Scorecard, dependency review). Actions are pinned to commits;
  # Dependabot moves the pin and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
