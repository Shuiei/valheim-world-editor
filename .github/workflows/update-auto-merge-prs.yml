# Update auto-merge pull requests: each time main moves (a pull request merged), merges main into every open
# pull request on main that has auto-merge on and whose checks are all green, as the Update branch button does.
# Main requires branches to be up to date, so without this auto-merge waits for someone to click it. Drafts,
# pull requests already up to date and those with a check failing or still running are left alone; one that
# cannot be updated (a conflict, a fork that does not allow edits) gets a warning in the run and is skipped.
# The merge is pushed with UPDATE_PRS_TOKEN (a fine-grained token of the maintainer's: this repository, Contents
# and Pull requests read and write): a push with the workflow's own token starts no workflow, and the updated pull
# request needs its CodeQL run (main's ruleset). Without the secret, the workflow's token updates the branches and
# warns that their workflows did not run.
# The merge is a new push: main's rules dismiss the approval it had (CodeRabbit's) and want the latest push
# approved, which CodeRabbit does not do for a merge of main alone. So for a pull request that was approved, the
# workflow asks it to approve again (@coderabbitai approve, as github-actions: a pull request's author cannot ask
# that, .coderabbit.yaml allow_author_approval): main's commits were reviewed when they were merged. Only when the
# new head is that merge and nothing else: its parents the old head and a commit of main, and its tree exactly
# what merging those two gives (git merge-tree, on the commits fetched as data: no pull request's code runs).
name: Update auto-merge PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-auto-merge-prs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      # Merge main into the pull requests' branches (without UPDATE_PRS_TOKEN), and comment on them.
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPDATE_TOKEN: ${{ secrets.UPDATE_PRS_TOKEN }}
    steps:
      # Main's history, to check what an update merged (the pull requests' commits are fetched as they come).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update the green pull requests with auto-merge on
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "::warning::UPDATE_PRS_TOKEN is not set: the branches are updated with the workflow's token, and their workflows (CodeQL) do not run on the update"
            UPDATE_TOKEN=$GH_TOKEN
          fi
          # Green: every check run done and passed (success, neutral or skipped), every status a success, and at
          # least one of them (a pull request whose checks have not started yet is not green).
          prs=$(gh pr list --base main --state open --limit 100 \
            --json number,headRefOid,isDraft,reviewDecision,autoMergeRequest,statusCheckRollup \
            --jq '.[] | select(.autoMergeRequest != null and (.isDraft | not))
              | select((.statusCheckRollup | length) > 0 and all(.statusCheckRollup[];
                  if .__typename == "CheckRun" then .status == "COMPLETED" and (.conclusion | IN("SUCCESS", "NEUTRAL", "SKIPPED"))
                  else .state == "SUCCESS" end))
              | "\(.number) \(.headRefOid) \(.reviewDecision)"')
          if [ -z "$prs" ]; then
            echo "No green pull request with auto-merge on."
            exit 0
          fi
          while read -r pr sha decision; do
            # In an if: a failed call (rate limit, a fork's commit) skips this pull request, not the others.
            if ! behind=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq .behind_by); then
              echo "::warning::#$pr could not be compared with main"
              continue
            fi
            if [ "$behind" = 0 ]; then
              echo "#$pr: up to date"
              continue
            fi
            # expected_head_sha: no update if someone pushed to the pull request meanwhile.
            if ! GH_TOKEN=$UPDATE_TOKEN gh api -X PUT "repos/$GH_REPO/pulls/$pr/update-branch" -f expected_head_sha="$sha" --silent; then
              echo "::warning::#$pr could not be updated (a conflict with main, or a fork that does not allow edits?)"
              continue
            fi
            echo "#$pr: updated ($behind commits behind main)"
            if [ "$decision" != APPROVED ]; then
              continue
            fi
            # Its approval back: only main's reviewed commits were added. Asked once the merge commit is the pull
            # request's head (update-branch only starts it), else the approval would be the old commit's and
            # dismissed at once.
            head=$sha
            for _ in $(seq 30); do
              head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid) || head=$sha
              [ "$head" != "$sha" ] && break
              sleep 2
            done
            # The new head must be that merge and nothing else: the old head and a commit of main as parents, and
            # the tree a clean merge of those two gives. A push by the author meanwhile (even a merge commit with
            # those parents) would be a head without that review, not to approve.
            merged=
            if [ "$head" != "$sha" ] && git fetch -q --no-tags origin "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/pull/$pr/head:refs/remotes/pull/$pr" \
              && [ "$(git rev-parse "refs/remotes/pull/$pr")" = "$head" ]; then
              read -r first second extra <<< "$(git rev-list --parents -n 1 "$head" | cut -d' ' -f2-)"
              if [ "$first" = "$sha" ] && [ -n "$second" ] && [ -z "$extra" ] && git merge-base --is-ancestor "$second" origin/main \
                && expected=$(git merge-tree --write-tree "$first" "$second") \
                && [ "$expected" = "$(git rev-parse "$head^{tree}")" ]; then
                merged=true
              fi
            fi
            if [ "$head" = "$sha" ]; then
              echo "::warning::#$pr: the merge commit did not show within a minute; CodeRabbit was not asked to approve"
            elif [ "$merged" != true ]; then
              echo "::warning::#$pr: its new head $head is not exactly main merged in; CodeRabbit was not asked to approve"
            elif ! gh pr comment "$pr" --body "@coderabbitai approve" > /dev/null; then
              echo "::warning::#$pr was updated but CodeRabbit could not be asked to approve it again"
            fi
          done <<< "$prs"
