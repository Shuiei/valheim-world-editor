# CodeQL (code scanning): the C# and the workflows, with the extended security queries, on every push to main,
# every pull request opened on this repository, whatever its base (a stacked one's is another pull request's branch;
# a fork's runs here too, with a read-only token and no secrets), and weekly. Main's ruleset requires its result on
# a pull request. The job runs on this repository only: a fork's own pushes and pull requests inside the fork run
# nothing.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'Shuiei/valheim-world-editor'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # C# read from the source (no build: CodeQL's build-mode none), as the default setup did.
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
