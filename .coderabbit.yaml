# CodeRabbit's reviews of pull requests (free for public repositories). It approves a pull request
# once its review of the latest commit is done, every thread it opened is resolved and no check fails
# (request_changes_workflow): the approval main's branch rules ask for. Reference:
# https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  profile: chill
  request_changes_workflow: true
  # Not `@coderabbitai approve` by a pull request's own author: the approval stays CodeRabbit's.
  allow_author_approval: false
  high_level_summary: true
  poem: false
  auto_review:
    # Off while the review-fix stacks (PRs #223 onwards) go in: each branch gets the CodeRabbit CLI
    # review before it is pushed, and main's rules ask for no approving review meanwhile. To be
    # turned back on once they are merged.
    enabled: false
    drafts: false
    # Every push reviewed, however many commits (else it pauses after 5, and the latest commit, so
    # the approval, waits).
    auto_pause_after_reviewed_commits: 0
    # Every pull request, also those stacked on another branch than main.
    base_branches:
      - ".*"
  pre_merge_checks:
    # The build requires a doc comment on every public type and member (CS1591, Directory.Build.props);
    # test methods have none on purpose (their names say what they check), which this check counts.
    docstrings:
      mode: "off"
  path_filters:
    # The tests' copies of the game's data and the documentation's pictures: data, not code.
    - "!editor/tests/fixtures/**"
    - "!docs/images/**"
  path_instructions:
    - path: "editor/Core/WorldGen/**"
      instructions: >-
        The world generator follows the game's formulas bit for bit (WorldCheck checks it against
        values recorded in the game): flag any change to arithmetic, casts or the order of random
        draws.
    - path: "editor/plugin/**"
      instructions: >-
        A BepInEx plugin for Valheim (Unity, .NET Framework 4.7.2): Unity calls Awake, Update and
        OnDestroy by name, Unity's == null also catches destroyed objects, and Harmony finds patch
        arguments by their names (__instance, __result).
chat:
  auto_reply: true
