# Valheim World Editor: tests and build checks on every push and pull request, and the release on main.
# The pipeline starts in .circleci/config.yml, which says whether a release is due (the release parameter), and
# whether the branch is a release pull request's (release_pr: its required checks report at once, no tests).
#   code-analysis  the editor (Core, Desktop, Sdk) and the plugin's API build with no .NET analyzer
#                  warning (warnings are errors); every XML file of the repository (projects, coverage
#                  settings) is well formed (xmllint)
#   formatting     the editor's projects are formatted as .editorconfig says (dotnet format,
#                  tools/format-check.sh) on two containers; a branch checks only the projects it
#                  changed since main (every one when .editorconfig or a build property changed),
#                  main checks all of them
#   core-tests     the core's tests on three containers (saves, the world generator against the game's
#                  values, live mode against a stand-in bridge, the SSH tunnel against a local sshd), and
#   app-tests      the app's windows, headless, on six containers, and the visual tests: the real
#                  editor drawing with OpenGL on a virtual screen (Xvfb, Mesa's software OpenGL),
#                  driven by the tests. Each builds its test project (editor/tests/Core.Tests, editor/tests/Desktop.Tests)
#                  with warnings as errors; CircleCI shares the test classes out by their last times
#                  and can rerun only the failed ones (circleci tests run). Every
#                  test runs, failing or not; a test stuck for 5 minutes (10 under coverage) ends its run.
#                  On main only, each test container keeps its code coverage for the coverage job;
#                  branches run the tests without it (several times faster).
#   coverage       on main only, once core-tests and app-tests have both passed: merges the nine
#                  containers' coverage into one report and sends it to Codecov (codecov.yml), which
#                  fails its own check (codecov/project) under 95% line coverage. A failed or partial test
#                  run sends nothing, so Codecov never shows the coverage of part of the tests.
#   packages       on main only: the Windows, Linux and Mac release packages build, hold no source
#                  code or game files (the plugin is left out: it builds against the game's own DLLs),
#                  and the Linux one starts and draws the test world (tools/smoke-test.sh, under Xvfb)
#   windows-smoke  on main only: the Windows package does the same on a Windows machine
#                  (tools/smoke-test.ps1). Both are slow and what they check (tools/release.sh, the
#                  packaging) seldom changes, so branches and pull requests run the tests only.
# When a release is due (main, a release pull request's commit "Release v<VERSION>", VERSION's CHANGELOG
# heading dated, no tag for it yet), the release
# workflow runs instead, and nothing in it runs before the approval (the tests ran on the pull request,
# which main's ruleset keeps up to date with main, so the merged commit's tree is the one they tested):
#   hold-release   waits for someone to approve it in CircleCI (the mod-token context is restricted)
#   packages, windows-smoke   as above: the packages to release, and the Windows one smoke-tested
#   github-release signs the Windows program (Authenticode, tools/sign-windows.sh: the maintainer's
#                  Certum certificate through SimplySign's cloud), builds the plugin's zip
#                  (tools/thunderstore.sh, against a Valheim dedicated server from SteamCMD and
#                  BepInExPack_Valheim), tags the commit and makes the GitHub release with the packages
#                  tested above (the Sign release workflow on GitHub adds Sigstore signatures to them)
#   publish-*      the plugin on Thunderstore and Hexium, and the plugin and the editor on Nexus Mods
#                  (tools/release/publish.cs, tools/release/sites.json), side by side
# How to release: docs/development.md#releasing.
# Security and bug patterns (CodeQL) are checked by GitHub's code scanning, set up on GitHub itself.
# What CI cannot cover: the plugin build (outside a release) and reading the game's data (both need
# Valheim's files), the game's look in the visual tests (copied from Valheim: CI's editor draws plain
# colours) and live mode against a real game.
version: 2.1

parameters:
  # Set by .circleci/config.yml: true on main when VERSION is ready to be released and not tagged yet.
  release:
    type: boolean
    default: false
  # Set by .circleci/config.yml: true on a release pull request's branch (release/v<VERSION>) that changes only
  # CHANGELOG.md and docs/releases/: no tests (main's code, tested as each pull request merged).
  release_pr:
    type: boolean
    default: false

orbs:
  # Codecov's official orb: uploads the coverage with Codecov's CLI, checked against its signature
  # (needs gpg). The token is the project's CODECOV_TOKEN. Any 6.x (the latest); a new major version is
  # taken by hand.
  codecov: codecov/codecov@6

executors:
  dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    resource_class: medium

commands:
  # The NuGet cache, one for every job that builds or restores (code-analysis, formatting, the test
  # jobs), made again on main when a project's packages change (code-analysis saves it).
  restore-nuget:
    steps:
      - restore_cache:
          keys:
            - nuget-v2-{{ checksum "Directory.Build.props" }}-{{ checksum "editor/Core/ValheimWorldEditor.Core.csproj" }}-{{ checksum "editor/Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "editor/tests/Core.Tests/Core.Tests.csproj" }}-{{ checksum "editor/tests/Desktop.Tests/Desktop.Tests.csproj" }}-{{ checksum "sdk/ValheimWorldEditor.Sdk/ValheimWorldEditor.Sdk.csproj" }}
            # Else main's latest (a branch whose packages changed restores only what it adds).
            - nuget-v2-

  # One test project's classes, shared out between the job's containers by
  # CircleCI by the time each class took in the last runs (circleci tests run). It also gives the job
  # "Rerun failed tests": a rerun runs only the classes that failed. Every test runs (a failure does
  # not stop the others); a test stuck 5 minutes ends the run (with a dump; 10 under coverage, on main),
  # and silence ends the step a minute after that.
  test-classes:
    parameters:
      project:
        type: string
      what:
        type: string
      results:
        type: string
      display:
        description: A virtual screen with OpenGL (Xvfb, Mesa's software renderer) for the visual tests.
        type: boolean
        default: false
    steps:
      - checkout
      - run:
          name: OpenSSH server (the tunnel's tests) and fonts (Avalonia headless)
          command: apt-get update -qq && apt-get install -y -qq openssh-server libfontconfig1 > /dev/null && mkdir -p /run/sshd
      - when:
          condition: << parameters.display >>
          steps:
            - run:
                name: Xvfb and Mesa's software OpenGL (the visual tests' virtual screen)
                command: |
                  apt-get install -y -qq --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 \
                    libgles2 libx11-6 libxrandr2 libxi6 libxcursor1 libice6 libsm6 > /dev/null
            # For the rest of the job (the tests' step finds it at :99). The image's keyboard layouts name
            # keys newer than its X libraries know: the keymap compiler's warnings about them (harmless,
            # not fatal) are left out, anything else Xvfb says is kept.
            - run:
                name: The virtual screen
                background: true
                command: |
                  Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp 2>&1 \
                    | grep --line-buffered -v -E 'Could not resolve keysym|^The XKEYBOARD keymap compiler \(xkbcomp\) reports:$|^Errors from xkbcomp are not fatal to the X server$'
      - restore-nuget
      - run:
          name: Build the tests (every warning is an error)
          command: dotnet build << parameters.project >> -c Release -warnaserror
      - run:
          name: << parameters.what >>
          no_output_timeout: 11m
          environment:
            VWE_NEED_SSHD: "1"
            # The mods the build downloaded (editor/tests/TestMods.targets) are kept through the test processes of
            # this run (the list is read, then run, in separate processes); the step after deletes them.
            VWE_KEEP_TEST_MODS: "1"
          command: |
            # A test stuck 5 minutes ends the run with a dump (editor/tests/testconfig.json). On main only, the
            # coverage of this container's share, kept for the coverage job: it makes the tests several
            # times slower, so a test is stuck after 10 minutes there (the world generator's tests share
            # the container's two cores with the others for minutes; one took 300 s on main). VWE_COVERAGE
            # tells the tests so: the editor's pictures may wait longer (EditorProcess), speeds are not
            # checked (SeedPreviewTests).
            coverage=""
            if [ "$CIRCLE_BRANCH" = main ]; then
              export VWE_COVERAGE=1
              coverage="--coverage --coverage-output-format cobertura --coverage-settings $PWD/editor/tests/coverage.runsettings"
              coverage+=" --coverage-output /tmp/coverage/<< parameters.results >>-$CIRCLE_NODE_INDEX/coverage.cobertura.xml"
              coverage+=" --hangdump-timeout 10m"
            fi
            # The virtual screen, where there is one (it starts in the background: a moment): the visual
            # tests draw on it, else they skip.
            if command -v Xvfb > /dev/null; then
              for _ in $(seq 100); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
              export DISPLAY=:99
            fi
            # Every test's full name (a theory's with its values in brackets), down to its class (a nested
            # one as Outer+Inner); circleci tests run gives this container's share, each as a --filter-class.
            # The results (JUnit) for CircleCI; the run's own files (a stuck test's dump: hundreds of MB)
            # in /tmp/test-runs, out of the artifacts; its output in /tmp/test-runs/output.log, for the
            # next step.
            mkdir -p /tmp/test-runs
            dotnet test --project << parameters.project >> -c Release --no-build --no-ansi --no-progress --list-tests \
              | sed -n 's/^  \([A-Za-z_]\)/\1/p' | sed 's/(.*//; s/\.[^.]*$//' | sort -u \
              | circleci tests run --split-by=timings --timings-type=classname --verbose --command="sed 's/^/--filter-class=/' \
                  | xargs dotnet test --project << parameters.project >> -c Release --no-build --no-ansi --no-progress --output Detailed \
                      --results-directory /tmp/test-runs $coverage \
                      --report-spekt-junit --report-spekt-junit-filename /tmp/test-results/<< parameters.results >>/results.xml" \
              2>&1 | tee /tmp/test-runs/output.log
      # A test process that crashed, or was stopped stuck, writes no results: one failed test in their
      # place, so CircleCI shows it and "Rerun failed tests" runs its class again. Its class is the stuck
      # test's (the hang dump's log: "[00:05:00] WorldEditor.Tests.SomeTests.AMethod"), else the test
      # class on the crash's stack (in the process's error output: "   at WorldEditor.Tests.SomeTests+<AMethod>d__4.MoveNext()": the
      # nested part stands in for a method), else TestHost; its text, the end of the run's output.
      - run:
          name: A crashed or stuck test process, as a failed test
          when: on_fail
          command: |
            results=/tmp/test-results/<< parameters.results >>
            log=/tmp/test-runs/output.log
            if [ -e "$results/results.xml" ] || [ ! -e "$log" ]; then exit 0; fi
            stuck=$(cat /tmp/test-runs/*_hang.log 2> /dev/null || true)
            if [ -n "$stuck" ]; then
              what="A test was stuck: the test process was stopped (with a dump)"
              class=$(printf '%s\n' "$stuck" | sed -n -E '1s/^\[[0-9:.]+\] +//; 1s/\(.*//; 1s/\.[A-Za-z0-9_]+$//p')
            else
              what="The test process crashed ($(grep -m 1 -o '^Exit code: [0-9]*' "$log" || echo 'no exit code'))"
              class=$(sed -n '/^  Error output: /,$p' "$log" \
                | grep -E -o '^ +at (TerrainEditor\.Desktop\.Tests|WorldEditor\.Tests)\.[A-Za-z0-9_.+<>]+' \
                | head -n 1 | sed -E 's/^ +at //; s/\+.*/.x/; s/\.[A-Za-z0-9_]+$//' || true)
            fi
            report=$( { printf '%s\n' "$stuck"; tail -n 80 "$log"; } | sed 's/]]>/]]]]><![CDATA[>/g')
            mkdir -p "$results"
            cat > "$results/crash.xml" \<<EOF
            <?xml version="1.0" encoding="utf-8"?>
            <testsuites>
              <testsuite name="${class:-TestHost}" tests="1" failures="1" errors="0">
                <testcase classname="${class:-TestHost}" name="$what" time="0">
                  <failure message="$what: the tests still running were not finished."><![CDATA[$report]]></failure>
                </testcase>
              </testsuite>
            </testsuites>
            EOF
      # The mods the build downloaded for the tests, deleted once every test process has run.
      - run:
          name: Delete the tests' downloaded mods
          when: always
          command: rm -rf "${TMPDIR:-/tmp}/vwe-test-mods"
      # Saved from main only: branches reuse main's (each cache is kept 15 days and billed).
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                key: nuget-v2-{{ checksum "Directory.Build.props" }}-{{ checksum "editor/Core/ValheimWorldEditor.Core.csproj" }}-{{ checksum "editor/Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "editor/tests/Core.Tests/Core.Tests.csproj" }}-{{ checksum "editor/tests/Desktop.Tests/Desktop.Tests.csproj" }}-{{ checksum "sdk/ValheimWorldEditor.Sdk/ValheimWorldEditor.Sdk.csproj" }}
                paths:
                  - ~/.nuget/packages
      # On main, the coverage of this container's tests, kept for the coverage job (which sends it with
      # the other containers'). Only when its tests passed: a container with a failed test keeps
      # nothing, and its job fails, so the coverage job does not run.
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: This container's coverage report is there
                command: |
                  ls /tmp/coverage/<< parameters.results >>-*/coverage.cobertura.xml \
                    || { echo "No coverage report: Codecov would get nothing from this container."; exit 1; }
            - persist_to_workspace:
                root: /tmp/coverage
                paths:
                  - << parameters.results >>-*/coverage.cobertura.xml
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results

jobs:
  code-analysis:
    executor: dotnet
    steps:
      - checkout
      - restore-nuget
      # Every XML file of the repository is well formed: the builds read only the projects they build, and
      # nothing reads editor/tests/coverage.runsettings before the tests on main (a "--" in its comment once made
      # every test container there refuse its options).
      - run:
          name: XML files are well formed (projects, coverage settings)
          command: |
            apt-get update -qq && apt-get install -y -qq libxml2-utils > /dev/null
            git ls-files -z '*.csproj' '*.props' '*.targets' '*.runsettings' '*.xml' | xargs -0 xmllint --noout
      - run:
          name: Analyzers (every warning is an error)
          command: |
            dotnet build editor/Desktop/ValheimWorldEditor.Desktop.csproj -c Release -warnaserror
            dotnet build sdk/WorldEditorBridge.Api/WorldEditorBridge.Api.csproj -c Release -warnaserror
      # Saved from main only: branches reuse main's (each cache is kept 15 days and billed).
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                key: nuget-v2-{{ checksum "Directory.Build.props" }}-{{ checksum "editor/Core/ValheimWorldEditor.Core.csproj" }}-{{ checksum "editor/Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "editor/tests/Core.Tests/Core.Tests.csproj" }}-{{ checksum "editor/tests/Desktop.Tests/Desktop.Tests.csproj" }}-{{ checksum "sdk/ValheimWorldEditor.Sdk/ValheimWorldEditor.Sdk.csproj" }}
                paths:
                  - ~/.nuget/packages

  # dotnet format on the five projects takes twice as long as the analyzers' build, so it is a job of
  # its own, on two containers: Desktop (loads Core and Sdk too) with Sdk on one, the rest on the other.
  formatting:
    executor: dotnet
    parallelism: 2
    steps:
      - checkout
      - restore-nuget
      - run:
          name: Formatting (dotnet format, as .editorconfig says)
          command: |
            case $CIRCLE_NODE_INDEX in
              0) projects="editor/Desktop/ValheimWorldEditor.Desktop.csproj sdk/ValheimWorldEditor.Sdk/ValheimWorldEditor.Sdk.csproj" ;;
              *) projects="editor/Core/ValheimWorldEditor.Core.csproj sdk/WorldEditorBridge.Api/WorldEditorBridge.Api.csproj sdk/samples/ExampleVehicles.WorldEditor/ExampleVehicles.WorldEditor.csproj $(git ls-files 'addons/*.csproj' | tr '\n' ' ')" ;;
            esac
            if [ "$CIRCLE_BRANCH" = main ]; then
              tools/format-check.sh $projects
            else
              # checkout fetched this branch alone; main over https (the image has no ssh, and the
              # repository is public).
              git fetch -q "https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git" main:refs/remotes/origin/main
              tools/format-check.sh --since origin/main $projects
            fi

  core-tests:
    executor: dotnet
    # The world generator's and dungeons' tests run several times slower under coverage (on main):
    # three containers keep the job about as long as app-tests.
    parallelism: 3
    steps:
      - test-classes:
          project: editor/tests/Core.Tests/Core.Tests.csproj
          what: Core tests (saves, world generator, live mode, SSH tunnel)
          results: core

  app-tests:
    executor: dotnet
    # Four cores: the visual tests' editor reads the world map and its close-ups on several threads, and on
    # main the coverage measures it too (on two cores a close-up took minutes).
    resource_class: large
    # The window tests run one at a time (one UI thread): more containers is what makes them faster.
    # Six keep the job about as long as code-analysis on branches (each container also spends about
    # 1.5 minutes setting up and building). The coverage job expects this many reports.
    parallelism: 6
    steps:
      - test-classes:
          project: editor/tests/Desktop.Tests/Desktop.Tests.csproj
          what: App tests (the windows, headless; the real editor drawing, on the virtual screen)
          results: app
          display: true

  # The add-ons' tests (addons/<Name>/tests: one test-classes step an add-on), then every add-on's zip as a release
  # makes it (tools/addons.sh). Not in Codecov's figure, which is the editor's (editor/tests/coverage.runsettings).
  addon-tests:
    executor: dotnet
    steps:
      - test-classes:
          project: addons/Tunnelheim/tests/Tunnelheim.WorldEditor.Tests/Tunnelheim.WorldEditor.Tests.csproj
          what: Tunnelheim add-on tests (its records replayed against the real mod's)
          results: addon-tunnelheim
      - run:
          name: The add-ons' zips
          command: tools/addons.sh /tmp/addons
      - store_artifacts:
          path: /tmp/addons
          destination: addons

  # The coverage of every test container, sent to Codecov in one go: the job runs on main only, once
  # core-tests and app-tests have both passed (workflows), so Codecov gets all nine containers' coverage
  # (core-tests' three, app-tests' six) or none. The nine reports are merged here into one
  # (tools/MergeCoverage, whose total the step prints) and that one file is sent: Codecov, given the
  # reports in one upload, kept only part of the app tests' coverage, and Microsoft's dotnet-coverage
  # merge dropped the lines' branch counts. The orb's fail_on_error does nothing (its
  # set_codecov_envs.sh empties CODECOV_FAIL_ON_ERROR, so the CLI never fails the step): a missing
  # report is caught before, and a failed upload leaves Codecov with the last full figure.
  coverage:
    executor: dotnet
    steps:
      # Codecov's CLI reads the commit and the repository's files from the checkout.
      - checkout
      - run:
          name: gpg (Codecov's CLI is checked against its signature)
          command: apt-get update -qq && apt-get install -y -qq gnupg > /dev/null
      - attach_workspace:
          at: /tmp/coverage
      - run:
          name: Every container's coverage report is there, merged into one
          command: |
            reports=()
            # Each test job's containers, as its parallelism says: core-tests 3, app-tests 6.
            for project in core:3 app:6; do
              count=${project#*:} project=${project%:*}
              for node in $(seq 0 $((count - 1))); do
                report=/tmp/coverage/$project-$node/coverage.cobertura.xml
                [ -e "$report" ] || { echo "No coverage report from $project-tests' container $node."; exit 1; }
                reports+=("$report")
              done
            done
            mkdir -p /tmp/upload
            # Prints the merged total, as Codecov should show it (lines run with every branch taken, of lines measured).
            dotnet run --project tools/MergeCoverage -c Release -- /tmp/upload/coverage.cobertura.xml "${reports[@]}"
      # The merged report itself, kept with the build: its line-by-line hits show which lines Codecov misses.
      - store_artifacts:
          path: /tmp/upload
          destination: coverage
      - codecov/upload:
          dir: /tmp/upload
          plugins: noop

  packages:
    executor: dotnet
    steps:
      - checkout
      - run:
          name: Tools for packaging
          command: |
            apt-get update -qq && apt-get install -y -qq zip > /dev/null
            # rcodesign signs the Mac app (ad hoc) on Linux; pinned and checked against its release's checksum.
            v=0.29.0; f=apple-codesign-$v-x86_64-unknown-linux-musl
            curl -fsSL -o /tmp/$f.tar.gz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$f.tar.gz"
            echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  /tmp/$f.tar.gz" | sha256sum -c -
            tar -C /tmp -xzf /tmp/$f.tar.gz && install /tmp/$f/rcodesign /usr/local/bin/rcodesign
      - run:
          name: Build the release packages
          command: tools/release.sh /tmp/dist
      - run:
          name: Check what is in them
          command: for p in /tmp/dist/*; do tools/check-package.sh "$p"; done
      - run:
          name: Smoke test of the Linux package (Xvfb, Mesa's software OpenGL)
          no_output_timeout: 5m
          command: |
            apt-get install -y -qq xvfb xauth mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 \
              libx11-6 libxrandr2 libxi6 libxcursor1 libice6 libsm6 libfontconfig1 > /dev/null
            mkdir -p /tmp/smoke && tar -C /tmp/smoke -xzf /tmp/dist/ValheimWorldEditor-*-linux-x64.tar.gz
            # The OpenGL the virtual screen offers (Mesa's software renderer, llvmpipe).
            xvfb-run -a -s "-screen 0 1600x1000x24" glxinfo -B | grep -E 'renderer|version' || true
            xvfb-run -a -s "-screen 0 1600x1000x24" tools/smoke-test.sh /tmp/smoke/ValheimWorldEditor/ValheimWorldEditor editor/tests/fixtures/CITest
      # The packages kept as artifacts (releases take them from there: about 135 MB a run, kept
      # 30 days).
      - store_artifacts:
          path: /tmp/dist
      # The Windows package for windows-smoke, and both for the release, in the same workflow.
      - persist_to_workspace:
          root: /tmp/dist
          paths:
            - "*.zip"
            - "*.tar.gz"

  windows-smoke:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - attach_workspace:
          at: C:\dist
      - run:
          name: Smoke test of the Windows package
          no_output_timeout: 5m
          command: |
            Expand-Archive (Get-Item C:\dist\ValheimWorldEditor-*-win-x64.zip).FullName -DestinationPath C:\smoke
            tools\smoke-test.ps1 C:\smoke\ValheimWorldEditor\ValheimWorldEditor.exe tests\fixtures\CITest

  # The Windows-only specs: the tests of the code paths only Windows takes (the home folder, file locks, the folder
  # flush that Windows does not need). They skip on Linux, so this runs the whole test project on a Windows machine,
  # on main and on the branches whose name has "windows" in it (a Windows fix can be checked before it is merged),
  # next to windows-smoke. The SDK is installed when the image has none (dot.net's install script).
  windows-tests:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      # Windows checks files out with CRLF line ends; the repository's .editorconfig asks for LF, and the build's
      # formatting analysis (warnings as errors) would fail on every file. So the checkout is redone with LF.
      - run:
          name: Line ends as the repository has them (LF)
          command: |
            git config core.autocrlf false
            git reset --hard HEAD
      - run:
          name: Windows-only specs
          no_output_timeout: 20m
          command: |
            if (-not ((dotnet --list-sdks 2> $null) -match '^10\.')) {
              Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $env:TEMP\dotnet-install.ps1
              & $env:TEMP\dotnet-install.ps1 -Channel 10.0 -InstallDir C:\dotnet
              $env:PATH = "C:\dotnet;$env:PATH"
            }
            # The code style is checked by formatting on Linux, with the SDK the build containers use. This image's
            # latest SDK reports the style differently, so its style analyzers are left out here.
            dotnet build tests\Core.Tests\Core.Tests.csproj -c Release -warnaserror -p:EnforceCodeStyleInBuild=false
            # The results as JUnit, so CircleCI lists each failing test (as the Linux test jobs do).
            New-Item -ItemType Directory -Force C:\test-results | Out-Null
            dotnet test --project tests\Core.Tests\Core.Tests.csproj -c Release --no-build --no-ansi --no-progress --report-spekt-junit --report-spekt-junit-filename C:\test-results\windows-core.xml
      - store_test_results:
          path: C:\test-results

  # The GitHub release, made from the packages packages made and windows-smoke tested (the workspace). The
  # plugin builds here against the game's own DLLs: a Valheim dedicated server (free, anonymous SteamCMD)
  # and the BepInExPack_Valheim the plugin's manifest depends on; nothing of them is kept. The release
  # notes: docs/releases/v<version>.md, else the CHANGELOG's sections since the last tag.
  github-release:
    executor: dotnet
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/dist
      - run:
          name: Tools (zip, SteamCMD's 32-bit libraries, GitHub's CLI, SSH for git fetch, ssign and osslsigncode)
          command: |
            apt-get update -qq && apt-get install -y -qq zip unzip lib32gcc-s1 openssh-client osslsigncode > /dev/null
            gh=2.63.2
            curl -fsSLO "https://github.com/cli/cli/releases/download/v$gh/gh_${gh}_linux_amd64.tar.gz"
            curl -fsSL "https://github.com/cli/cli/releases/download/v$gh/gh_${gh}_checksums.txt" | grep "gh_${gh}_linux_amd64.tar.gz" | sha256sum -c -
            tar -xzf "gh_${gh}_linux_amd64.tar.gz" -C /usr/local --strip-components=1
            # ssign signs with the Certum certificate (its releases publish no checksums: this one's, taken when it was pinned).
            ssign=0.1.7
            curl -fsSLO "https://github.com/Le-Syl21/ssign/releases/download/v$ssign/ssign-linux-x86_64.tar.gz"
            echo "fefab025b283f96e078d50705add3c46b0981d0f3235bc84e25c0249c709fc6b  ssign-linux-x86_64.tar.gz" | sha256sum -c -
            tar -xzf ssign-linux-x86_64.tar.gz -C /usr/local/bin ssign
      - run:
          name: Still to be released
          command: |
            git fetch -q --tags origin
            version=$(tr -d '[:space:]' < VERSION)
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "v$version is tagged already (released from another pipeline?)."; exit 1
            fi
            ls /tmp/dist/ValheimWorldEditor-v$version-linux-x64.tar.gz /tmp/dist/ValheimWorldEditor-v$version-win-x64.zip
      # After windows-smoke, which ran the unsigned program: the signature changes nothing in how it runs,
      # and the context's secrets (CERTUM_EMAIL, CERTUM_OTP) reach only the jobs after the approval.
      - run:
          name: Sign the Windows program (Authenticode)
          command: tools/sign-windows.sh /tmp/dist/ValheimWorldEditor-v$(tr -d '[:space:]' < VERSION)-win-x64.zip
      - run:
          name: The game's DLLs (Valheim dedicated server, SteamCMD) and BepInEx
          no_output_timeout: 20m
          command: |
            mkdir -p /tmp/steamcmd && curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C /tmp/steamcmd
            # SteamCMD sometimes stops after updating itself: tried again.
            for try in 1 2 3; do
              /tmp/steamcmd/steamcmd.sh +force_install_dir /tmp/valheim +login anonymous +app_update 896660 +quit \
                && [ -f /tmp/valheim/valheim_server_Data/Managed/assembly_valheim.dll ] && break
              [ $try = 3 ] && exit 1
            done
            pack=$(grep -o 'denikson-BepInExPack_Valheim-[0-9.]*' tools/thunderstore/bridge/manifest.json | sed 's/.*-//')
            curl -fsSL -o /tmp/bepinex.zip "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$pack/"
            unzip -q /tmp/bepinex.zip -d /tmp/bepinex
      - run:
          name: The plugin's zip
          environment:
            ValheimDir: /tmp/valheim
            BepInExDir: /tmp/bepinex/BepInExPack_Valheim/BepInEx
          command: tools/thunderstore.sh /tmp/dist
      - run:
          name: The SDK's sample plugin builds (never shipped)
          environment:
            ValheimDir: /tmp/valheim
            BepInExDir: /tmp/bepinex/BepInExPack_Valheim/BepInEx
          command: dotnet build sdk/samples/ExampleVehicles.Bridge/ExampleVehicles.Bridge.csproj -c Release -warnaserror
      - run:
          name: The SDK for mod authors' zip
          command: tools/sdk.sh /tmp/dist
      - run:
          name: The add-ons' zips, one each
          command: tools/addons.sh /tmp/dist
      - run:
          name: The release notes
          command: |
            version=$(tr -d '[:space:]' < VERSION)
            last=$(git tag -l 'v*' --sort=-v:refname | head -1)
            dotnet run tools/release/publish.cs -- notes CHANGELOG.md "$version" "${last:--}" /tmp/dist/notes.md "docs/releases/v$version.md"
      - run:
          name: Tag and GitHub release
          command: |
            version=$(tr -d '[:space:]' < VERSION)
            # A release made with this token (not GitHub Actions' own) starts the Sign release workflow.
            GH_TOKEN=$GITHUB_TOKEN gh release create "v$version" --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --target "$CIRCLE_SHA1" --title "v$version" --notes-file /tmp/dist/notes.md \
              /tmp/dist/ValheimWorldEditor-v$version-win-x64.zip /tmp/dist/ValheimWorldEditor-v$version-linux-x64.tar.gz \
              /tmp/dist/ValheimWorldEditor-v$version-macos-arm64-experimental.zip \
              /tmp/dist/WorldEditorBridge-$version.zip /tmp/dist/ValheimWorldEditor.Sdk-$version.zip \
              /tmp/dist/ValheimWorldEditor-addon-*.zip
      - store_artifacts:
          path: /tmp/dist/notes.md
      - persist_to_workspace:
          root: /tmp/dist
          paths:
            - WorldEditorBridge-*.zip
            - notes.md

  # A required check of a release pull request, reported at once: its code is main's, tested already.
  tested-on-main:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Tested on main
          command: echo "A release pull request changes only CHANGELOG.md and docs/releases/; its code was tested on main."

  # The plugin on one mod site, or the plugin and the editor on Nexus Mods (tools/release/publish.cs).
  publish:
    executor: dotnet
    parameters:
      site:
        type: string
      options:
        type: string
        default: ""
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/dist
      - run:
          name: Publish on << parameters.site >>
          command: dotnet run tools/release/publish.cs -- << parameters.site >> /tmp/dist << parameters.options >>

workflows:
  # Side by side; windows-smoke waits for the Windows package that packages makes, and coverage for
  # both test jobs to pass. Branches and pull requests run code-analysis, formatting, the two test
  # jobs and addon-tests: packages, windows-smoke and coverage are main's, and windows-tests main's and the "windows"
  # branches'. Main's ruleset requires the first four checks of a pull request, and no other: it must stay in step
  # with this list (addon-tests is not one of them yet).
  test:
    when:
      and:
        - not: << pipeline.parameters.release >>
        - not: << pipeline.parameters.release_pr >>
    jobs:
      - packages:
          filters:
            branches:
              only: main
      - code-analysis
      - formatting
      - core-tests
      - app-tests
      - addon-tests
      - windows-smoke:
          requires:
            - packages
          filters:
            branches:
              only: main
      - windows-tests:
          filters:
            branches:
              only:
                - main
                - /.*windows.*/
      - coverage:
          requires:
            - core-tests
            - app-tests
          filters:
            branches:
              only: main

  # A release pull request: the four checks main's ruleset requires, reported at once (no tests: main's code).
  release-pr:
    when: << pipeline.parameters.release_pr >>
    jobs:
      - tested-on-main:
          name: code-analysis
      - tested-on-main:
          name: formatting
      - tested-on-main:
          name: core-tests
      - tested-on-main:
          name: app-tests

  # The approval first, so nothing runs for a release nobody approves; then only what the release needs:
  # the packages (the tests ran on the pull request, on the same tree) and the Windows smoke test, then
  # the release. The mod-token context's secrets (GITHUB_TOKEN, THUNDERSTORE_TOKEN, HEXIUM_TOKEN,
  # NEXUS_API_KEY, CERTUM_EMAIL, CERTUM_OTP) reach only the release jobs.
  release:
    when: << pipeline.parameters.release >>
    jobs:
      - hold-release:
          type: approval
      - packages:
          requires:
            - hold-release
      - windows-smoke:
          requires:
            - packages
      - github-release:
          context: mod-token
          requires:
            - windows-smoke
      - publish:
          name: publish-thunderstore
          site: thunderstore
          context: mod-token
          requires:
            - github-release
      - publish:
          name: publish-hexium
          site: hexium
          context: mod-token
          requires:
            - github-release
      - publish:
          name: publish-nexus
          site: nexus
          options: --notes /tmp/dist/notes.md
          context: mod-token
          requires:
            - github-release
