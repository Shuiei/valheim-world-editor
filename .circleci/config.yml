# Valheim World Editor: tests and build checks on every push and pull request.
#   code-analysis  the editor (Core, Desktop) builds with no .NET analyzer warning (warnings are
#                  errors) and is formatted as .editorconfig says (dotnet format)
#   core-tests     the core's tests on three containers (saves, the world generator against the game's
#                  values, live mode against a stand-in bridge, the SSH tunnel against a local sshd), and
#   app-tests      the app's windows, headless, on three containers (the visual tests skip: no
#                  display). Both build tests/Desktop.Tests with warnings as errors; CircleCI shares
#                  the test classes out by their last times and can rerun only the failed ones
#                  (circleci tests run, tools/ci-tests.sh). Every test runs, failing or not; a test
#                  stuck for 5 minutes ends its run.
#   coverage       the code coverage of both test jobs, merged (tools/coverage.sh): an HTML report in
#                  the artifacts, and the job fails when the line coverage is under 95%
#   packages       the Windows and Linux release packages: they build, hold no source code or game
#                  files (the plugin is left out: it builds against the game's own DLLs), and the
#                  Linux one starts and draws the test world (tools/smoke-test.sh, under Xvfb)
#   windows-smoke  the Windows package does the same on a Windows machine (tools/smoke-test.ps1)
# Security and bug patterns (CodeQL) are checked by GitHub's code scanning, set up on GitHub itself.
# What CI cannot cover: the plugin build and reading the game's data (both need Valheim's files), the
# visual tests (they need a display and OpenGL) and live mode against a real game.
version: 2.1

executors:
  dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    resource_class: medium

commands:
  # One namespace's test classes (no visual tests), shared out between the job's containers by
  # CircleCI by the time each class took in the last runs (circleci tests run). It also gives the job
  # "Rerun failed tests": a rerun runs only the classes that failed. Every test runs (a failure does
  # not stop the others); a test stuck 5 minutes ends the run (with a dump), and silence ends the step
  # sooner than CircleCI's 10 minutes.
  test-classes:
    parameters:
      namespace:
        type: string
      what:
        type: string
      results:
        type: string
    steps:
      - checkout
      - run:
          name: OpenSSH server (the tunnel's tests) and fonts (Avalonia headless)
          command: apt-get update -qq && apt-get install -y -qq openssh-server libfontconfig1 > /dev/null && mkdir -p /run/sshd
      - restore_cache:
          keys:
            - nuget-v2-{{ checksum "Directory.Build.props" }}-{{ checksum "Core/ValheimWorldEditor.Core.csproj" }}-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "tests/Desktop.Tests/Desktop.Tests.csproj" }}
            # Else main's latest (a branch whose packages changed restores only what it adds).
            - nuget-v2-
      - run:
          name: Build the tests (every warning is an error)
          command: dotnet build tests/Desktop.Tests/Desktop.Tests.csproj -c Release -warnaserror
      - run:
          name: << parameters.what >>
          no_output_timeout: 6m
          environment:
            VWE_NEED_SSHD: "1"
          command: |
            tools/ci-tests.sh list << parameters.namespace >> \
              | circleci tests run --command="xargs tools/ci-tests.sh run << parameters.results >>" --split-by=timings --timings-type=classname --verbose
      # Saved from main only: branches reuse main's (each cache is kept 15 days and billed).
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                key: nuget-v2-{{ checksum "Directory.Build.props" }}-{{ checksum "Core/ValheimWorldEditor.Core.csproj" }}-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "tests/Desktop.Tests/Desktop.Tests.csproj" }}
                paths:
                  - ~/.nuget/packages
      # The coverage of this container's tests, for the coverage job.
      - persist_to_workspace:
          root: /tmp/coverage
          paths:
            - "*"
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results

jobs:
  code-analysis:
    executor: dotnet
    steps:
      - checkout
      # One NuGet cache for both jobs that build (code-analysis, native-tests), made again on main when a
      # project's packages change.
      - restore_cache:
          keys:
            - nuget-v2-{{ checksum "Directory.Build.props" }}-{{ checksum "Core/ValheimWorldEditor.Core.csproj" }}-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "tests/Desktop.Tests/Desktop.Tests.csproj" }}
            # Else main's latest (a branch whose packages changed restores only what it adds).
            - nuget-v2-
      - run:
          name: Analyzers (every warning is an error)
          command: dotnet build Desktop/ValheimWorldEditor.Desktop.csproj -c Release -warnaserror
      - run:
          name: Formatting (dotnet format, as .editorconfig says)
          command: |
            for p in Core/ValheimWorldEditor.Core.csproj Desktop/ValheimWorldEditor.Desktop.csproj; do
              dotnet format whitespace "$p" --verify-no-changes --no-restore
              dotnet format style "$p" --verify-no-changes --no-restore
            done
      # Saved from main only: branches reuse main's (each cache is kept 15 days and billed).
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                key: nuget-v2-{{ checksum "Directory.Build.props" }}-{{ checksum "Core/ValheimWorldEditor.Core.csproj" }}-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "tests/Desktop.Tests/Desktop.Tests.csproj" }}
                paths:
                  - ~/.nuget/packages

  core-tests:
    executor: dotnet
    # The world generator's and dungeons' tests run several times slower under coverage: three
    # containers keep the job about as long as app-tests.
    parallelism: 3
    steps:
      - test-classes:
          namespace: WorldEditor.Tests
          what: Core tests (saves, world generator, live mode, SSH tunnel)
          results: core

  app-tests:
    executor: dotnet
    # The window tests run one at a time (one UI thread): more containers is what makes them faster.
    parallelism: 3
    steps:
      - test-classes:
          namespace: TerrainEditor.Desktop.Tests
          what: App tests (the windows, headless)
          results: app

  # The coverage of every test container, merged: under the minimum, the job fails.
  coverage:
    executor: dotnet
    steps:
      # The sources, for the report's pages of covered and uncovered lines.
      - checkout
      - attach_workspace:
          at: /tmp/coverage
      - run:
          name: Coverage report (line coverage at least 95%)
          # Every test container's coverage: core-tests' three and app-tests' three (their parallelism).
          command: |
            dotnet tool restore
            tools/coverage.sh /tmp/coverage /tmp/coverage-report 95 core-0 core-1 core-2 app-0 app-1 app-2
      - store_artifacts:
          path: /tmp/coverage-report
          destination: coverage

  packages:
    executor: dotnet
    steps:
      - checkout
      - run:
          name: Tools for packaging
          command: apt-get update -qq && apt-get install -y -qq zip > /dev/null
      - run:
          name: Build the release packages
          command: tools/release.sh /tmp/dist
      - run:
          name: Check what is in them
          command: for p in /tmp/dist/*; do tools/check-package.sh "$p"; done
      - run:
          name: Smoke test of the Linux package (Xvfb, Mesa's software OpenGL)
          no_output_timeout: 5m
          command: |
            apt-get install -y -qq xvfb xauth mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 \
              libx11-6 libxrandr2 libxi6 libxcursor1 libice6 libsm6 libfontconfig1 > /dev/null
            mkdir -p /tmp/smoke && tar -C /tmp/smoke -xzf /tmp/dist/ValheimWorldEditor-*-linux-x64.tar.gz
            # The OpenGL the virtual screen offers (Mesa's software renderer, llvmpipe).
            xvfb-run -a -s "-screen 0 1600x1000x24" glxinfo -B | grep -E 'renderer|version' || true
            xvfb-run -a -s "-screen 0 1600x1000x24" tools/smoke-test.sh /tmp/smoke/ValheimWorldEditor/ValheimWorldEditor tests/fixtures/CITest
      # The packages kept as artifacts only for main (releases take them from there: about 135 MB a
      # run, kept 30 days); other branches only test them.
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - store_artifacts:
                path: /tmp/dist
      # The Windows package for windows-smoke, in the same workflow.
      - persist_to_workspace:
          root: /tmp/dist
          paths:
            - "*.zip"

  windows-smoke:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - attach_workspace:
          at: C:\dist
      - run:
          name: Smoke test of the Windows package
          no_output_timeout: 5m
          command: |
            Expand-Archive (Get-Item C:\dist\ValheimWorldEditor-*-win-x64.zip).FullName -DestinationPath C:\smoke
            tools\smoke-test.ps1 C:\smoke\ValheimWorldEditor\ValheimWorldEditor.exe tests\fixtures\CITest

workflows:
  # The packages first: when the app does not build or start, nothing else runs.
  test:
    jobs:
      - packages
      - code-analysis:
          requires:
            - packages
      - core-tests:
          requires:
            - packages
      - app-tests:
          requires:
            - packages
      - windows-smoke:
          requires:
            - packages
      - coverage:
          requires:
            - core-tests
            - app-tests
