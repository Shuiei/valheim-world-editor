# Valheim World Editor: tests and build checks on every push and pull request.
#   code-analysis  the editor (Core, Desktop) builds with no .NET analyzer warning (warnings are
#                  errors) and is formatted as .editorconfig says (dotnet format)
#   native-tests   the app's tests (tests/Desktop.Tests): its windows headless, the core (saves,
#                  the world generator against the game's values, live mode against a stand-in
#                  bridge), the SSH tunnel against a local sshd; the visual tests skip (no display).
#                  Fail fast: the first failing test stops its run, a test stuck for 5 minutes ends
#                  it, and the core and the windows run as two processes, one after the other (the
#                  windows' run does not start when the core fails; half the memory each)
#   packages       the Windows and Linux release packages: they build, hold no source code or game
#                  files (the plugin is left out: it builds against the game's own DLLs), and the
#                  Linux one starts and draws the test world (tools/smoke-test.sh, under Xvfb)
#   windows-smoke  the Windows package does the same on a Windows machine (tools/smoke-test.ps1)
# Security and bug patterns (CodeQL) are checked by GitHub's code scanning, set up on GitHub itself.
# What CI cannot cover: the plugin build and the game-look export (both need Valheim's files), the
# visual tests (they need a display and OpenGL) and live mode against a real game.
version: 2.1

executors:
  dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    resource_class: medium

jobs:
  code-analysis:
    executor: dotnet
    steps:
      - checkout
      - restore_cache:
          keys:
            - nuget-analysis-v1-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "Core/ValheimWorldEditor.Core.csproj" }}
      - run:
          name: Analyzers (every warning is an error)
          command: dotnet build Desktop/ValheimWorldEditor.Desktop.csproj -c Release -warnaserror
      - run:
          name: Formatting (dotnet format, as .editorconfig says)
          command: |
            for p in Core/ValheimWorldEditor.Core.csproj Desktop/ValheimWorldEditor.Desktop.csproj; do
              dotnet format whitespace "$p" --verify-no-changes --no-restore
              dotnet format style "$p" --verify-no-changes --no-restore
            done
      - save_cache:
          key: nuget-analysis-v1-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "Core/ValheimWorldEditor.Core.csproj" }}
          paths:
            - ~/.nuget/packages

  native-tests:
    executor: dotnet
    steps:
      - checkout
      - run:
          name: OpenSSH server (the tunnel's tests) and fonts (Avalonia headless)
          command: apt-get update -qq && apt-get install -y -qq openssh-server libfontconfig1 > /dev/null && mkdir -p /run/sshd
      - restore_cache:
          keys:
            - nuget-native-v1-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "tests/Desktop.Tests/Desktop.Tests.csproj" }}
      - run:
          name: Build the tests
          command: dotnet build tests/Desktop.Tests/Desktop.Tests.csproj -c Release
      # Fail fast: xUnit stops at the first failure (StopOnFail), a test stuck 5 minutes ends the run
      # (with a dump), and silence ends the step sooner than CircleCI's 10 minutes.
      - run:
          name: Core tests (saves, world generator, live mode, SSH tunnel)
          no_output_timeout: 6m
          environment:
            VWE_NEED_SSHD: "1"
          command: |
            dotnet test tests/Desktop.Tests/Desktop.Tests.csproj -c Release --no-build \
              --filter "Category!=Visual&FullyQualifiedName~WorldEditor.Tests." --blame-hang-timeout 5m \
              --logger "junit;LogFilePath=/tmp/test-results/core/results.xml" --logger "console;verbosity=normal" \
              -- xUnit.StopOnFail=true
      - run:
          name: App tests (the windows, headless)
          no_output_timeout: 6m
          command: |
            dotnet test tests/Desktop.Tests/Desktop.Tests.csproj -c Release --no-build \
              --filter "Category!=Visual&FullyQualifiedName~TerrainEditor.Desktop.Tests." --blame-hang-timeout 5m \
              --logger "junit;LogFilePath=/tmp/test-results/app/results.xml" --logger "console;verbosity=normal" \
              -- xUnit.StopOnFail=true
      - save_cache:
          key: nuget-native-v1-{{ checksum "Desktop/ValheimWorldEditor.Desktop.csproj" }}-{{ checksum "tests/Desktop.Tests/Desktop.Tests.csproj" }}
          paths:
            - ~/.nuget/packages
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results

  packages:
    executor: dotnet
    steps:
      - checkout
      - run:
          name: Tools for packaging
          command: apt-get update -qq && apt-get install -y -qq zip python3 python3-pip curl > /dev/null
      - run:
          name: Build the release packages (without the plugin)
          environment:
            SKIP_PLUGIN: "1"
            PIP_BREAK_SYSTEM_PACKAGES: "1"
          command: tools/release.sh /tmp/dist
      - run:
          name: Check what is in them
          command: for p in /tmp/dist/*; do tools/check-package.sh "$p" --no-plugin; done
      - run:
          name: Smoke test of the Linux package (Xvfb, Mesa's software OpenGL)
          no_output_timeout: 5m
          command: |
            apt-get install -y -qq xvfb xauth mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 \
              libx11-6 libxrandr2 libxi6 libxcursor1 libice6 libsm6 libfontconfig1 > /dev/null
            mkdir -p /tmp/smoke && tar -C /tmp/smoke -xzf /tmp/dist/ValheimWorldEditor-*-linux-x64.tar.gz
            # The OpenGL the virtual screen offers (Mesa's software renderer, llvmpipe).
            xvfb-run -a -s "-screen 0 1600x1000x24" glxinfo -B | grep -E 'renderer|version' || true
            xvfb-run -a -s "-screen 0 1600x1000x24" tools/smoke-test.sh /tmp/smoke/ValheimWorldEditor/ValheimWorldEditor tests/fixtures/CITest
      - store_artifacts:
          path: /tmp/dist
      - persist_to_workspace:
          root: /tmp/dist
          paths:
            - "*.zip"

  windows-smoke:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - attach_workspace:
          at: C:\dist
      - run:
          name: Smoke test of the Windows package
          no_output_timeout: 5m
          command: |
            Expand-Archive (Get-Item C:\dist\ValheimWorldEditor-*-win-x64.zip).FullName -DestinationPath C:\smoke
            tools\smoke-test.ps1 C:\smoke\ValheimWorldEditor\ValheimWorldEditor.exe tests\fixtures\CITest

workflows:
  # The packages first: when the app does not build or start, nothing else runs.
  test:
    jobs:
      - packages
      - code-analysis:
          requires:
            - packages
      - native-tests:
          requires:
            - packages
      - windows-smoke:
          requires:
            - packages
