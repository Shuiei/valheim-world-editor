# Codecov (https://app.codecov.io/gh/Shuiei/valheim-world-editor): merges the coverage of the six test
# containers of CircleCI's core-tests and app-tests, which CircleCI's coverage job sends on main once
# both have passed (tools/ci-tests.sh; branches send none), and checks it on each of main's commits. Which code counts is set by tests/coverage.runsettings.
# Reference:
# https://docs.codecov.com/docs/codecovyml-reference
codecov:
  require_ci_to_pass: true
  notify:
    # The coverage job's one upload (core-tests' three containers and app-tests' three together).
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  status:
    # The whole editor's line coverage: the check fails under 95%.
    project:
      default:
        target: 95%
        threshold: 0%
    # No patch check and no pull request comment: pull requests send no coverage.
    patch: off

comment: false
